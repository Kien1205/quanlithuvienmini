<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-800">Đăng Nhập Thư Viện Mini</h2>
    
    <form (submit)="onLogin()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Tài khoản</label>
        <input type="text" [(ngModel)]="username" name="username" required
          class="w-full px-3 py-2 mt-1 border rounded-md focus:outline-none focus:ring focus:ring-blue-300">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
        <input type="password" [(ngModel)]="password" name="password" required
          class="w-full px-3 py-2 mt-1 border rounded-md focus:outline-none focus:ring focus:ring-blue-300">
      </div>

      <button type="submit"
        class="w-full py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none">
        Đăng Nhập
      </button>
    </form>
  </div>
</div>
